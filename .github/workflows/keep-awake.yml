# Render's free plan puts the server to sleep after 15 idle minutes, and the
# first request after that takes ~40s (search looks broken). Pinging the health
# endpoint every 10 minutes keeps it awake. Delete this file to stop it.
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the BeatBond health endpoint
        run: curl -sS --max-time 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" https://beatbond-75ns.onrender.com/health || echo "Server did not respond"
